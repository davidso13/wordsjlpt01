<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>회독 JLPT</title>
<meta name="description" content="10개씩 끊어 외우고, 30문제 퀴즈로 확인하고, 5회독으로 완성하는 JLPT 단어장">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column — sticky header with 正-tally progress, phase view, fixed bottom tab bar */
:root {
  --bg: #F2F3F7;
  --surface: #FFFFFF;
  --ink: #1B2036;
  --muted: #676D84;
  --line: #E0E2EA;
  --ai: #2D3C7C;          /* 藍 indigo — the accent */
  --ai-ink: #FFFFFF;
  --ai-soft: #E5E8F5;
  --ok: #3B7A55;          /* matcha — 완벽 */
  --ok-soft: #E3F0E7;
  --hard: #A86A12;        /* amber — 헷갈림 */
  --hard-soft: #F8ECD6;
  --bad: #B03F35;
  --bad-soft: #F8E2DF;
  --stamp: #B03F35;
  --shadow: 0 1px 2px rgba(27,32,54,.06), 0 4px 16px rgba(27,32,54,.05);
  --f-jp: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-kana: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --f-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11131B; --surface: #1A1D29; --ink: #E8EAF2; --muted: #9AA0B6; --line: #2B2F40;
    --ai: #8F9DE3; --ai-ink: #11131B; --ai-soft: #252B47;
    --ok: #7FC59B; --ok-soft: #1C3226; --hard: #E2B063; --hard-soft: #3A2D16;
    --bad: #EC8B80; --bad-soft: #3C201D; --stamp: #EC8B80;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11131B; --surface: #1A1D29; --ink: #E8EAF2; --muted: #9AA0B6; --line: #2B2F40;
  --ai: #8F9DE3; --ai-ink: #11131B; --ai-soft: #252B47;
  --ok: #7FC59B; --ok-soft: #1C3226; --hard: #E2B063; --hard-soft: #3A2D16;
  --bad: #EC8B80; --bad-soft: #3C201D; --stamp: #EC8B80;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
[hidden] { display: none !important; }
.jp { font-family: var(--f-jp); }
.kana { font-family: var(--f-kana); }

.app { max-width: 540px; margin: 0 auto; padding-inline: 16px; padding-block: 0 112px; }

/* header */
.barwrap { flex-basis: 100%; }
.top { flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brand b { font-size: 19px; letter-spacing: -.02em; }
.brand b em { font-style: normal; color: var(--ai); }
.brand small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tally { width: 42px; height: 42px; flex: none; }
.tally line { stroke-linecap: round; stroke-width: 9; }
.stamp { flex: none; width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--stamp); color: var(--stamp); display: grid; place-items: center; text-align: center; line-height: 1.05; transform: rotate(-8deg); font-weight: 700; }
.stamp span { font-size: 17px; font-family: var(--f-jp); display: block; }
.stamp small { font-size: 10px; letter-spacing: .04em; }
.iconbtn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { background: var(--ai-soft); color: var(--ai); }

.setbar { display: flex; gap: 6px; padding-block: 12px 4px; flex-wrap: wrap; }
.seg { flex: 1 1 0; min-width: 28px; height: 6px; border-radius: 3px; background: var(--line); }
.seg.done { background: var(--ai); }
.seg.now { background: linear-gradient(90deg, var(--ai) 50%, var(--ai-soft) 50%); }
.seg.review.done, .seg.review.now { background: var(--hard); }
.setmeta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* coach */
.coach { display: flex; gap: 10px; margin-block: 16px; align-items: flex-start; }
.avatar { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--ai); color: var(--ai-ink); display: grid; place-items: center; font-family: var(--f-jp); font-weight: 800; font-size: 17px; }
.bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 4px var(--r) var(--r) var(--r); padding: 11px 14px; min-width: 0; box-shadow: var(--shadow); }
.bubble p { margin: 0; }
.bubble p + p { margin-top: 6px; }
.bubble .who { font-size: 11px; color: var(--muted); letter-spacing: .06em; font-weight: 700; display: block; margin-bottom: 2px; }
.bubble code { font-family: var(--f-ui); background: var(--ai-soft); color: var(--ai); padding: 1px 6px; border-radius: 6px; font-size: 13px; }

h2.settitle { font-size: 20px; margin: 22px 0 4px; letter-spacing: -.02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
.chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--ai-soft); color: var(--ai); vertical-align: middle; margin-left: 6px; letter-spacing: .02em; }
.chip.review { background: var(--hard-soft); color: var(--hard); }

.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); background: transparent; border: 0; padding: 4px 0; }
.switch i { width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .2s; }
.switch[aria-pressed="true"] i { background: var(--ai); }
.switch[aria-pressed="true"] i::after { transform: translateX(14px); }

/* word cards */
.cards { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.card.hardmark { border-color: var(--hard); }
.card-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card-top .idx { font-weight: 700; color: var(--ai); font-size: 13px; }
.card-top .tag { color: var(--hard); font-weight: 700; }
.card-top .iconbtn { margin-left: auto; width: 30px; height: 30px; }
.line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
.line .jp { font-size: 27px; font-weight: 800; letter-spacing: .02em; }
.line .kana { font-size: 15px; color: var(--muted); }
.line .mean { font-weight: 700; font-size: 16px; }
.line .sep { color: var(--line); }
.ex { margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 14px; }
.ex .ja { font-family: var(--f-kana); display: block; }
.ex .ja mark { background: transparent; color: var(--ai); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.ex .ko { color: var(--muted); display: block; font-size: 13px; }
.hide .card:not(.open) .mean, .hide .card:not(.open) .kana, .hide .card:not(.open) .ko { filter: blur(6px); user-select: none; }
.hide .card { cursor: pointer; }

/* buttons */
.actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.btn { border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 700; font-size: 15px; background: var(--ai); color: var(--ai-ink); width: 100%; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--ai); border: 1px solid var(--line); }
.btn.small { width: auto; padding: 8px 12px; font-size: 13px; border-radius: 10px; }

/* check */
.rows { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.row .idx { font-weight: 700; color: var(--ai); width: 30px; flex: none; font-variant-numeric: tabular-nums; font-size: 13px; }
.row .w { flex: 1; min-width: 0; }
.row .w .jp { font-size: 19px; font-weight: 800; margin-right: 6px; }
.row .w small { color: var(--muted); font-size: 12px; }
.pick { display: flex; gap: 4px; flex: none; }
.pick button { border: 1px solid var(--line); background: transparent; border-radius: 9px; padding: 6px 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
.pick button.on.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.pick button.on.hard { background: var(--hard-soft); color: var(--hard); border-color: var(--hard); }
.cmd { display: flex; gap: 8px; margin-block: 14px; }
.cmd input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 14px; font: inherit; }
.cmd .btn { width: auto; white-space: nowrap; }
.hint { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
.counts { display: flex; gap: 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b.ok { color: var(--ok); } .counts b.hard { color: var(--hard); }

/* quiz */
.qhead { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--line); margin: 8px 0 18px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ai); transition: width .25s; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px 18px; text-align: center; box-shadow: var(--shadow); }
.qtype { font-size: 12px; font-weight: 700; color: var(--ai); letter-spacing: .06em; }
.qprompt { margin: 12px 0 4px; font-size: 40px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.qprompt.sent { font-family: var(--f-kana); font-size: 21px; font-weight: 500; }
.qprompt.sent mark { background: var(--ai-soft); color: var(--ai); font-family: var(--f-jp); font-weight: 800; padding: 0 3px; border-radius: 4px; text-decoration: underline; text-underline-offset: 4px; }
.qnote { color: var(--muted); font-size: 13px; margin: 0; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 10px; font-size: 16px; font-weight: 500; text-align: left; display: flex; gap: 8px; align-items: center; min-width: 0; }
.opt .k { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--ai-soft); color: var(--ai); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.opt span:last-child { min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--ai); }
.opt.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }
.opt.jpopt { font-family: var(--f-jp); font-size: 19px; font-weight: 800; }
.opt.kanaopt { font-family: var(--f-kana); }
.feedback { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; }
.feedback.good { background: var(--ok-soft); color: var(--ok); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback .jp { font-weight: 800; }

/* result */
.score { text-align: center; padding: 26px 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; margin-top: 16px; box-shadow: var(--shadow); }
.score .big { font-size: 54px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.score .big small { font-size: 22px; color: var(--muted); font-weight: 500; }
.score p { margin: 6px 0 0; color: var(--muted); }
.list { margin-top: 18px; display: grid; gap: 8px; }
.list h3 { margin: 0 0 2px; font-size: 14px; color: var(--muted); font-weight: 500; }
.miss { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14px; display: grid; gap: 2px; }
.miss .q { color: var(--muted); font-size: 12px; }
.miss .a b { color: var(--ok); }
.miss .a s { color: var(--bad); margin-left: 8px; }

/* notes + words */
.empty { text-align: center; color: var(--muted); padding: 40px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); margin-top: 16px; }
.daylabel { margin: 22px 0 8px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.wtable { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.wrow { display: grid; grid-template-columns: 36px minmax(0,1.1fr) minmax(0,1fr) auto; gap: 8px; align-items: baseline; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.wrow:first-child { border-top: 0; }
.wrow .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.wrow .jp { font-size: 17px; font-weight: 800; }
.wrow .jp small { display: block; font-family: var(--f-kana); font-weight: 400; font-size: 12px; color: var(--muted); }
.badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--hard-soft); color: var(--hard); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .in { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { border: 0; background: transparent; padding: 10px 4px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ai); font-weight: 700; }
.tab .dot { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--hard); color: var(--surface); font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 10; background: rgba(10,12,20,.45); display: grid; place-items: end center; }
.sheet .panel { background: var(--surface); width: 100%; max-width: 540px; border-radius: 18px 18px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
.sheet h3 { margin: 0; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; }
.btn.danger { background: var(--bad); color: var(--surface); }

.toast { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13px; z-index: 12; max-width: calc(100% - 32px); }

@media (max-width: 400px) {
  .opts { grid-template-columns: 1fr; }
  .qprompt { font-size: 34px; }
  .pick button { padding: 6px 8px; }
}
@media (prefers-reduced-motion: no-preference) {
  .view { animation: rise .28s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* home: 차수 선택 */
.decks { display: grid; gap: 10px; margin-top: 4px; }
.deck { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.deck-main { display: flex; gap: 14px; align-items: center; border: 0; background: transparent; padding: 0; text-align: left; width: 100%; min-width: 0; }
.deck-seal { flex: none; width: 52px; height: 52px; border-radius: 12px; background: var(--ai-soft); color: var(--ai); display: grid; place-items: center; font-family: var(--f-jp); font-weight: 800; font-size: 22px; }
.deck.photo .deck-seal { background: var(--hard-soft); color: var(--hard); }
.deck-info { min-width: 0; flex: 1; display: grid; gap: 2px; }
.deck-info b { font-size: 18px; letter-spacing: -.02em; overflow-wrap: anywhere; }
.deck-info small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.deck-go { flex: none; color: var(--ai); font-weight: 700; font-size: 14px; }
.deck-prog { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.deck-prog i { width: 18px; height: 5px; border-radius: 3px; background: var(--line); }
.deck-prog i.on { background: var(--stamp); }
.deck-prog span { margin-left: 6px; }
.deck-tools { display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 10px; }
.linkbtn { border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 4px 6px; border-radius: 8px; }
.linkbtn:hover { color: var(--ai); background: var(--ai-soft); }
.linkbtn.del:hover { color: var(--bad); background: var(--bad-soft); }
.inline { display: flex; gap: 8px; width: 100%; }
.inline input, .field input, .field textarea { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: inherit; }
.newdeck { margin-top: 14px; border: 1.5px dashed var(--ai); background: var(--ai-soft); color: var(--ai); border-radius: var(--r); padding: 16px; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font-weight: 700; }
.newdeck svg { flex: none; }
.newdeck small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
.loading { color: var(--muted); text-align: center; padding: 30px 0; }

/* upload: 사진으로 새 차수 */
.field { display: grid; gap: 6px; margin-top: 14px; }
.field > span { font-size: 13px; font-weight: 700; }
.field > small { color: var(--muted); font-size: 12px; }
.drop { margin-top: 14px; border: 1.5px dashed var(--line); border-radius: var(--r); background: var(--surface); padding: 24px 16px; text-align: center; display: grid; gap: 6px; justify-items: center; cursor: pointer; color: var(--muted); }
.drop:hover, .drop:focus-within { border-color: var(--ai); color: var(--ai); }
.drop b { color: var(--ink); font-size: 15px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 12px; }
.thumb { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(10,12,20,.6); color: #fff; font-size: 14px; line-height: 1; }
.status { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; background: var(--ai-soft); color: var(--ai); }
.status.err { background: var(--bad-soft); color: var(--bad); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; vertical-align: -2px; margin-right: 6px; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }
.edits { display: grid; gap: 8px; margin-top: 12px; }
.edit { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 28px repeat(3, minmax(0, 1fr)) 30px; gap: 6px; align-items: center; }
.edit .n { color: var(--muted); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
.edit input { min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 8px; font: inherit; font-size: 14px; }
.edit input.jp { font-family: var(--f-jp); font-weight: 800; }

  .edit input.mean { grid-column: 2 / 4; grid-row: 2; }

</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="메뉴" id="tabnav"><div class="in" id="tabs"></div></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const MAX_ROUND = 5;
const isKana = s => /^[぀-ヿ]+$/.test(s);
const pad = n => String(n).padStart(3, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- server ---------- */
async function api(method, url, body) {
  const r = await fetch(url, {method, headers: body ? {'Content-Type': 'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j?.error || `서버 오류가 났어요 (${r.status}).`);
  return j;
}

/* ---------- app-wide state ---------- */
let view = 'home';            // home | app | upload
let decks = null, decksError = null, renaming = null;
let DECK = null, WORDS = [], W = {};
let S = null;                  // 선택한 차수의 학습 상태 (브라우저에 차수별로 저장)
let U = null;                  // 사진 업로드 상태
const opened = new Set();
const deckKey = id => `hoedok-jlpt-v2:deck:${id}`;
const sigOf = words => words.map(w => w.w).join('|');

/* ---------- deck & study state ---------- */
function buildSets(round, confused) {
  const sets = [];
  if (round > 1) {
    const ids = Object.keys(confused).map(Number).filter(id => W[id]).sort((a, b) => confused[b] - confused[a] || a - b);
    for (let i = 0; i < ids.length; i += 10) sets.push({kind: 'review', ids: ids.slice(i, i + 10)});
  }
  for (let i = 0; i < WORDS.length; i += 10) sets.push({kind: 'regular', ids: WORDS.slice(i, i + 10).map(w => w.no)});
  return sets;
}
function fresh() {
  return {v: 2, sig: sigOf(WORDS), started: false, round: 1, setIdx: 0, phase: 'study', sets: buildSets(1, {}),
          confused: {}, misses: {}, marks: {}, quiz: null, last: null, history: [], hide: false, tab: 'learn'};
}
// 예전 버전(1차수 50단어 고정)에서 공부한 기록을 1차수로 옮긴다.
function migrateV1() {
  const o = store.get('hoedok-jlpt-v1');
  if (!o || !o.sets) return null;
  const byLabel = Object.fromEntries(WORDS.map(w => [w.label, w.no]));
  const map = n => byLabel[pad(n)];
  if (!WORDS.length || Object.keys(byLabel).length !== 50 || !map(26) || !map(75)) return null;
  const remap = obj => Object.fromEntries(Object.entries(obj || {}).map(([k, v]) => [map(+k), v]).filter(([k]) => k));
  const st = {...fresh(), started: o.started, round: o.round, setIdx: o.setIdx, phase: o.phase === 'quiz' ? 'check' : o.phase,
    sets: o.sets.map(s => ({kind: s.kind, ids: s.ids.map(map).filter(Boolean)})), confused: remap(o.confused), misses: remap(o.misses),
    marks: remap(o.marks), last: o.last, history: o.history || [], hide: !!o.hide};
  if (st.phase === 'result' && !st.last) st.phase = 'study';
  store.del('hoedok-jlpt-v1');
  return st;
}
function loadState() {
  const o = store.get(deckKey(DECK.id));
  if (o && o.v === 2 && o.sig === sigOf(WORDS) && o.sets) return o;
  return (DECK.source_file === '261012_JLPTN4단어_D1.txt' && migrateV1()) || fresh();
}
function save() { if (S && DECK) store.set(deckKey(DECK.id), S); }
function deckProgress(d) {
  const o = store.get(deckKey(d.id));
  if (!o || o.v !== 2) return {round: 0, text: '아직 시작 전'};
  if (o.phase === 'complete') return {round: MAX_ROUND, text: '5회독 완주'};
  return {round: o.round - 1, text: o.phase === 'roundEnd' ? `${o.round}회독 완료` : `${o.round}회독 · ${Math.min(o.setIdx + 1, o.sets.length)}/${o.sets.length}세트`};
}

async function loadDecks() {
  decksError = null;
  try { decks = (await api('GET', '/api/decks')).decks; }
  catch (e) { decksError = e.message; }
  if (view === 'home') render();
}
async function openDeck(id) {
  const d = decks?.find(x => x.id === id);
  DECK = d || {id, name: '차수'};
  view = 'app'; S = null; render(true);
  try {
    const j = await api('GET', `/api/deck?id=${id}`);
    DECK = j.deck;
    WORDS = j.words.map((w, i) => ({no: i + 1, label: w.no_label, w: w.word, r: w.reading || w.word, m: w.meaning, ex: w.example, ko: w.example_ko, sec: w.section}));
    W = Object.fromEntries(WORDS.map(w => [w.no, w]));
    opened.clear();
    S = loadState();
    render(true);
  } catch (e) {
    view = 'home'; render(true); toast(e.message);
  }
}
function goHome() { view = 'home'; S = null; DECK = null; render(true); loadDecks(); }

const curSet = () => S.sets[S.setIdx];
function setLabel(i) {
  const s = S.sets[i];
  if (s.kind === 'review') {
    const k = S.sets.slice(0, i + 1).filter(x => x.kind === 'review').length;
    return {title: `오답 노트 세트 ${k}`, range: `헷갈린 단어 ${s.ids.length}개`};
  }
  const k = S.sets.slice(0, i + 1).filter(x => x.kind === 'regular').length;
  const a = W[s.ids[0]], b = W[s.ids[s.ids.length - 1]];
  return {title: `${k}세트`, range: `${a.no}–${b.no}번${a.label && b.label ? ` · No.${a.label}–${b.label}` : ''}`};
}

/* ---------- quiz: 일본어 단어(한자)를 보고 한국어 뜻 고르기 ---------- */
function pickFrom(pool, n, exclude) {
  const out = [];
  for (const x of shuffle(pool)) { if (!exclude.includes(x) && !out.includes(x)) out.push(x); if (out.length === n) break; }
  return out;
}
function makeQ(id, type, setIds) {
  const w = W[id];
  const answer = w.m;
  if (type === 'context' && !(w.ex && w.ex.includes(w.w))) type = 'meaning';
  let label, note, sentence = null, pool;
  if (type === 'context') {
    label = '예문 속 뜻'; note = '밑줄 친 단어의 뜻은?'; sentence = w.ex;
    pool = WORDS.filter(x => x.sec === w.sec).map(x => x.m);
  } else if (type === 'set') {
    label = '헷갈리는 보기'; note = '같은 세트 단어 중에서 골라 보세요';
    pool = setIds.map(x => W[x].m);
  } else {
    label = '뜻 고르기'; note = '알맞은 한국어 뜻을 고르세요';
    pool = WORDS.map(x => x.m);
  }
  let wrong = pickFrom(pool, 3, [answer]);
  if (wrong.length < 3) wrong = wrong.concat(pickFrom(WORDS.map(x => x.m), 3 - wrong.length, [answer, ...wrong]));
  return {id, type, label, prompt: w.w, sentence, note, opts: shuffle([answer, ...wrong]), answer, picked: null};
}
function buildQuiz(ids) {
  const qs = [];
  for (const id of ids) qs.push(makeQ(id, 'meaning', ids), makeQ(id, 'context', ids), makeQ(id, 'set', ids));
  let best = shuffle(qs);
  for (let t = 0; t < 30; t++) {
    const c = shuffle(qs); let clash = 0;
    for (let i = 1; i < c.length; i++) if (c[i].id === c[i - 1].id) clash++;
    if (clash === 0) { best = c; break; }
  }
  return {qs: best, i: 0};
}

/* ---------- mark parsing: "1,3,5 완벽 / 2,4,6 헷갈림" ---------- */
function parseMarks(text, ids) {
  const res = {};
  for (const seg of text.split(/[\/\n;|]/)) {
    const kind = /헷갈|모름|모르|몰라|애매/.test(seg) ? 'hard' : /완벽|외웠|암기|알아|앎/.test(seg) ? 'ok' : null;
    if (!kind) continue;
    const re = /(\d+)\s*[-~]\s*(\d+)|(\d+)/g; let m;
    const nums = [];
    while ((m = re.exec(seg))) {
      if (m[3]) nums.push(+m[3]);
      else for (let n = +m[1]; n <= +m[2] && nums.length < 100; n++) nums.push(n);
    }
    for (const n of nums) if (n >= 1 && n <= ids.length) res[ids[n - 1]] = kind;
  }
  return res;
}

function say(text) {
  try {
    if (!('speechSynthesis' in window)) return toast('이 브라우저는 음성 재생을 지원하지 않아요');
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = .9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- photo upload ---------- */
function freshUpload() {
  const n = (decks?.length || 0) + 1;
  return {step: 'pick', name: `${n}차수`, files: [], busy: false, status: '', error: '', words: []};
}
async function prepImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error('사진을 열 수 없어요. JPG나 PNG 사진을 골라 주세요.')); img.src = url; });
    const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL('image/jpeg', 0.85);
    return {name: file.name, dataUrl, b64: dataUrl.split(',')[1]};
  } finally { URL.revokeObjectURL(url); }
}
async function addFiles(list) {
  const files = [...list].filter(f => f.type.startsWith('image/'));
  if (!files.length) { toast('사진 파일을 골라 주세요'); return; }
  U.error = '';
  const room = Math.max(0, 5 - U.files.length);
  if (files.length > room) toast('사진은 한 번에 5장까지 올릴 수 있어요');
  for (const f of files.slice(0, room)) {
    try { U.files.push(await prepImage(f)); } catch (e) { U.error = e.message; }
  }
  render();
}
async function recognize() {
  if (!U.files.length || U.busy) return;
  U.busy = true; U.error = ''; const found = [];
  try {
    for (let i = 0; i < U.files.length; i++) {
      U.status = `사진 ${i + 1}/${U.files.length}에서 단어를 찾는 중이에요. 장당 20~40초쯤 걸려요.`; render();
      const j = await api('POST', '/api/recognize', {image: U.files[i].b64, mediaType: 'image/jpeg'});
      found.push(...j.words);
    }
    const seen = new Set();
    U.words = found.filter(w => { const k = w.word + '|' + w.meaning; if (seen.has(k)) return false; seen.add(k); return true; });
    if (!U.words.length) U.error = '사진에서 일본어 단어를 찾지 못했어요. 단어가 잘 보이게 다시 찍어 주세요.';
    else U.step = 'review';
  } catch (e) { U.error = e.message; }
  U.busy = false; U.status = ''; render(true);
}
async function saveUpload() {
  const name = U.name.trim();
  const words = U.words.filter(w => w.word.trim() && w.meaning.trim());
  if (!name) { U.error = '차수 이름을 입력해 주세요.'; render(); return; }
  if (words.length < 4) { U.error = '퀴즈 보기를 만들려면 단어와 뜻이 있는 줄이 4개 이상 필요해요.'; render(); return; }
  U.busy = true; U.error = ''; U.status = 'DB에 저장하는 중이에요.'; render();
  try {
    const j = await api('POST', '/api/decks', {name, words});
    U = null; await loadDecks(); toast(`'${j.deck.name}' 차수를 저장했어요`); openDeck(j.deck.id);
  } catch (e) { U.busy = false; U.status = ''; U.error = e.message; render(); }
}

/* ---------- render ---------- */
const ICON = {
  speak: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  more: '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  camera: '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  learn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 12h5"/></svg>',
  notes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9.5 13.5l5 5M14.5 13.5l-5 5"/></svg>',
  words: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>',
  decks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>'
};

function tally(doneCount, current) {
  // 正 — 다섯 획, 회독 하나에 한 획
  const L = [[14,14,86,14],[50,14,50,86],[50,50,80,50],[24,44,24,86],[8,86,92,86]];
  return `<svg class="tally" viewBox="0 0 100 100" role="img" aria-label="${doneCount}회독 완료">` +
    L.map((l, i) => {
      const st = i < doneCount ? 'var(--stamp)' : i === doneCount && current ? 'var(--ai)' : 'var(--line)';
      const dash = i === doneCount && current ? ' stroke-dasharray="8 9"' : '';
      return `<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="${st}"${dash}/>`;
    }).join('') + '</svg>';
}

function renderTop() {
  const top = document.getElementById('top');
  if (view !== 'app' || !S) {
    const sub = view === 'upload' ? '사진으로 새 차수 만들기' : view === 'app' ? `${esc(DECK?.name)} 불러오는 중` : 'JLPT N4 · 차수를 골라 시작하세요';
    top.innerHTML = `${view === 'home' ? tally(0, false) : `<button class="iconbtn" data-act="home" aria-label="차수 선택으로">${ICON.back}</button>`}
      <div class="brand"><b>회독 <em>JLPT</em></b><small>${sub}</small></div>
      <div class="stamp" aria-hidden="true"><div><span>N4</span><small>단어장</small></div></div>`;
    return;
  }
  const done = S.phase === 'complete';
  let bar = '';
  if (S.tab === 'learn' && !done) {
    const lab = setLabel(Math.min(S.setIdx, S.sets.length - 1));
    bar = `<div class="setbar" aria-hidden="true">${S.sets.map((s, i) =>
      `<span class="seg ${s.kind}${i < S.setIdx || (i === S.setIdx && S.phase === 'result') ? ' done' : i === S.setIdx ? ' now' : ''}"></span>`).join('')}</div>
      <div class="setmeta"><span>${S.phase === 'roundEnd' ? `${S.round}회독 완료` : `${lab.title} · ${phaseName()}`}</span><span>${Math.min(S.setIdx + 1, S.sets.length)} / ${S.sets.length} 세트</span></div>`;
  }
  top.innerHTML = `
    ${tally(done ? MAX_ROUND : S.round - 1, !done)}
    <div class="brand"><b>회독 <em>JLPT</em></b><small>${esc(DECK.name)} · ${WORDS.length}단어</small></div>
    <div class="stamp" title="현재 회독"><div><span>${done ? '完' : S.round}</span><small>${done ? '5회독' : '회독'}</small></div></div>
    <button class="iconbtn" data-act="menu" aria-label="설정">${ICON.more}</button>
    ${bar ? `<div class="barwrap">${bar}</div>` : ''}`;
}
function phaseName() {
  return {study: '단어 학습', check: '암기 체크', quiz: '미니 퀴즈', result: '채점 결과'}[S.phase] || '';
}
function coach(html) {
  return `<div class="coach"><div class="avatar" aria-hidden="true">回</div><div class="bubble"><span class="who">AI 단어장 코치</span>${html}</div></div>`;
}

function viewHome() {
  let list;
  if (decksError) list = `<div class="status err">${esc(decksError)}</div><div class="actions"><button class="btn ghost" data-act="retryDecks">다시 불러오기</button></div>`;
  else if (!decks) list = `<p class="loading"><span class="spin"></span>차수 목록을 불러오는 중이에요</p>`;
  else if (!decks.length) list = `<div class="empty">아직 차수가 없어요.<br>아래에서 사진으로 첫 차수를 만들어 보세요.</div>`;
  else list = `<div class="decks">${decks.map(d => {
    const p = deckProgress(d);
    const sub = d.source === 'file' && d.source_file
      ? `${esc(d.source_file.replace(/\.txt$/, '').replace(/_/g, ' · '))}`
      : `사진으로 만든 차수 · ${new Date(d.created_at).toLocaleDateString('ko-KR')}`;
    const seal = (d.name.match(/\d+/) || [d.name.slice(0, 1)])[0];
    return `<article class="deck${d.source === 'photo' ? ' photo' : ''}">
      ${renaming === d.id
        ? `<form class="inline" data-form="rename" data-id="${d.id}"><input id="renameInput" maxlength="40" value="${esc(d.name)}" aria-label="새 차수 이름"><button class="btn small" type="submit">저장</button><button class="btn ghost small" type="button" data-act="renameCancel">취소</button></form>`
        : `<button class="deck-main" data-act="openDeck" data-id="${d.id}">
            <span class="deck-seal" aria-hidden="true">${esc(seal)}</span>
            <span class="deck-info"><b>${esc(d.name)}</b><small>${sub} · ${d.word_count}단어</small></span>
            <span class="deck-go">학습 ›</span></button>`}
      <div class="deck-prog" aria-label="진도 ${esc(p.text)}">${[0,1,2,3,4].map(i => `<i class="${i < p.round ? 'on' : ''}"></i>`).join('')}<span>${esc(p.text)}</span></div>
      <div class="deck-tools">
        <button class="linkbtn" data-act="renameStart" data-id="${d.id}">이름 바꾸기</button>
        ${d.source === 'photo' ? `<button class="linkbtn del" data-act="deleteDeck" data-id="${d.id}">삭제</button>` : ''}
      </div></article>`;
  }).join('')}</div>`;
  return coach(`<p><b>회독 JLPT에 오신 걸 환영해요!</b> 공부할 차수를 골라 주세요.</p>
      <p>차수마다 10개씩 세트로 보고, 암기 체크와 30문제 퀴즈를 거쳐 5회독까지 진행해요. 진도는 차수별로 따로 저장돼요.</p>`) +
    `<h2 class="settitle">차수 선택</h2>` + list +
    `<button class="newdeck" data-act="upload">${ICON.camera}<span>사진으로 새 차수 만들기<small>단어장 사진을 찍으면 단어, 읽는 법, 뜻을 자동으로 정리해요</small></span></button>`;
}

function viewUpload() {
  const u = U;
  const status = (u.status ? `<div class="status"><span class="spin"></span>${esc(u.status)}</div>` : '') + (u.error ? `<div class="status err">${esc(u.error)}</div>` : '');
  const nameField = `<label class="field"><span>차수 이름</span><input id="deckName" data-up="name" maxlength="40" value="${esc(u.name)}" placeholder="예: 3차수, DAY 05 교통"><small>홈 화면에 이 이름으로 보여요. 나중에 바꿀 수 있어요.</small></label>`;
  if (u.step === 'pick') {
    return coach(`<p>단어장이나 노트 사진을 올려 주세요. 사진 속 <b>일본어 단어, 읽는 법, 한국어 뜻</b>을 찾아 정리하고, 예문도 함께 만들어 드려요.</p>
        <p>인식 결과는 저장하기 전에 직접 고칠 수 있어요.</p>`) + nameField + `
      <label class="drop">${ICON.camera}<b>사진 찍기 또는 앨범에서 고르기</b><span>한 번에 5장까지 · 글자가 또렷하게 보이도록 찍어 주세요</span>
        <input id="photoInput" type="file" accept="image/*" multiple data-up="files"></label>
      ${u.files.length ? `<div class="thumbs">${u.files.map((f, i) => `<div class="thumb"><img src="${f.dataUrl}" alt="올린 사진 ${i + 1}"><button data-act="removeFile" data-i="${i}" aria-label="사진 ${i + 1} 빼기" ${u.busy ? 'disabled' : ''}>×</button></div>`).join('')}</div>` : ''}
      ${status}
      <div class="actions"><button class="btn" data-act="recognize" ${!u.files.length || u.busy ? 'disabled' : ''}>${u.busy ? '인식하는 중…' : u.files.length ? `사진 ${u.files.length}장에서 단어 인식하기` : '먼저 사진을 올려 주세요'}</button>
      <button class="btn ghost" data-act="home">취소</button></div>`;
  }
  return coach(`<p>단어 <b>${u.words.length}개</b>를 찾았어요. 틀린 글자가 있으면 고치고, 필요 없는 줄은 ×로 지워 주세요.</p><p>저장하면 DB에 새 차수로 등록되고 바로 학습을 시작해요.</p>`) + nameField + `
    <div class="edits">${u.words.map((w, i) => `<div class="edit">
      <span class="n">${i + 1}</span>
      <input class="jp" lang="ja" data-up="word" data-i="${i}" value="${esc(w.word)}" placeholder="단어" aria-label="${i + 1}번 단어">
      <input lang="ja" data-up="reading" data-i="${i}" value="${esc(w.reading)}" placeholder="읽는 법" aria-label="${i + 1}번 읽는 법">
      <input class="mean" data-up="meaning" data-i="${i}" value="${esc(w.meaning)}" placeholder="뜻" aria-label="${i + 1}번 뜻">
      <button class="x" data-act="delRow" data-i="${i}" aria-label="${i + 1}번 줄 지우기">×</button>
      <input class="ex" lang="ja" data-up="example" data-i="${i}" value="${esc(w.example)}" placeholder="예문 (선택)" aria-label="${i + 1}번 예문">
    </div>`).join('')}</div>
    <div class="actions"><button class="btn ghost" data-act="addRow">+ 단어 줄 추가</button></div>
    ${status}
    <div class="actions"><button class="btn" data-act="saveDeck" ${u.busy ? 'disabled' : ''}>DB에 저장하고 학습 시작</button>
    <button class="btn ghost" data-act="backToPick" ${u.busy ? 'disabled' : ''}>사진 다시 고르기</button></div>`;
}

function cardHTML(id, i) {
  const w = W[id];
  const ex = w.ex ? esc(w.ex).replace(esc(w.w), `<mark>${esc(w.w)}</mark>`) : '';
  const miss = S.confused[id];
  return `<article class="card${opened.has(id) ? ' open' : ''}${miss ? ' hardmark' : ''}" data-act="reveal" data-id="${id}">
    <div class="card-top"><span class="idx">[${i + 1}]</span>${w.label ? `<span>No.${esc(w.label)}</span>` : ''}${miss ? `<span class="tag">헷갈림 ${miss}회</span>` : ''}
      <button class="iconbtn" data-act="say" data-id="${id}" aria-label="${esc(w.w)} 발음 듣기">${ICON.speak}</button></div>
    <div class="line"><span class="jp" lang="ja">${esc(w.w)}</span><span class="sep">|</span><span class="kana" lang="ja">${esc(w.r)}</span><span class="sep">|</span><span class="mean">${esc(w.m)}</span></div>
    ${ex ? `<p class="ex"><span class="ja" lang="ja">${ex}</span><span class="ko">${esc(w.ko)}</span></p>` : ''}
  </article>`;
}

function viewStudy() {
  const set = curSet(), lab = setLabel(S.setIdx);
  let msg;
  if (!S.started) {
    msg = `<p><b>${esc(DECK.name)}을 시작해요!</b> 단어 ${WORDS.length}개를 10개씩 ${Math.ceil(WORDS.length / 10)}세트로 나눠 5회독으로 완성합니다.</p>
      <p>단어 보기 → 암기 상태 체크 → 퀴즈 순서로 진행해요. 헷갈린 단어는 오답 노트에 모아서 다음 회독 첫 세트로 다시 나와요. 먼저 1세트부터 시작할게요.</p>`;
  } else if (set.kind === 'review') {
    msg = `<p>${S.round}회독 시작이에요. 지난 회독에서 헷갈렸던 단어부터 먼저 잡고 갈게요. 이번엔 꼭 내 것으로 만들어 봐요.</p>`;
  } else {
    msg = `<p>${S.round}회독 ${lab.title}입니다. 소리 내어 읽으면서 예문까지 한 번씩 훑어보세요. 다 봤다면 <b>뜻 가리기</b>를 켜고 스스로 떠올려 보세요.</p>`;
  }
  return coach(msg) + `
    <h2 class="settitle">[${lab.title}: ${lab.range}]<span class="chip${set.kind === 'review' ? ' review' : ''}">${set.kind === 'review' ? '오답 노트' : `${S.round}회독`}</span></h2>
    <p class="sub">단어 | 후리가나 | 뜻 | 예문 (한국어 해석)</p>
    <div class="toolbar">
      <button class="switch" data-act="hide" aria-pressed="${S.hide}"><i></i>뜻 가리기</button>
      ${S.hide ? '<span class="sub" style="margin:0">카드를 누르면 뜻이 보여요</span>' : ''}
    </div>
    <div class="cards${S.hide ? ' hide' : ''}">${set.ids.map(cardHTML).join('')}</div>
    <div class="actions"><button class="btn" data-act="toCheck">다 봤어요, 암기 체크하기</button></div>`;
}

function viewCheck() {
  const set = curSet();
  const ok = set.ids.filter(id => S.marks[id] === 'ok').length, hard = set.ids.filter(id => S.marks[id] === 'hard').length;
  const left = set.ids.length - ok - hard;
  return coach(`<p>수고했어요! <b>완벽히 외운 단어 번호와 아직 헷갈리는 단어 번호를 알려주세요!</b></p>
      <p>예: <code>1,3,5 완벽 / 2,4,6 헷갈림</code> 처럼 입력하거나, 아래에서 하나씩 눌러도 돼요.</p>`) + `
    <form class="cmd" data-form="marks">
      <input id="markInput" autocomplete="off" placeholder="1,3,5 완벽 / 2,4,6 헷갈림" aria-label="암기 상태 입력">
      <button class="btn" type="submit">적용</button>
    </form>
    <p class="hint">번호는 세트 안의 [1]~[${set.ids.length}] 번호예요. 1-5처럼 범위도 돼요.</p>
    <div class="toolbar"><div class="counts"><span>완벽 <b class="ok">${ok}</b></span><span>헷갈림 <b class="hard">${hard}</b></span><span>남음 <b>${left}</b></span></div>
      ${left ? `<button class="btn ghost small" data-act="restOk">나머지 모두 완벽</button>` : ''}</div>
    <div class="rows">${set.ids.map((id, i) => {
      const w = W[id], m = S.marks[id];
      return `<div class="row"><span class="idx">[${i + 1}]</span>
        <div class="w"><span class="jp" lang="ja">${esc(w.w)}</span><small>${esc(w.m)}</small></div>
        <div class="pick"><button class="ok${m === 'ok' ? ' on' : ''}" data-act="mark" data-id="${id}" data-kind="ok" aria-pressed="${m === 'ok'}">완벽</button>
        <button class="hard${m === 'hard' ? ' on' : ''}" data-act="mark" data-id="${id}" data-kind="hard" aria-pressed="${m === 'hard'}">헷갈림</button></div></div>`;
    }).join('')}</div>
    <div class="actions">
      <button class="btn" data-act="toQuiz" ${left ? 'disabled' : ''}>${left ? `${left}개 더 체크해 주세요` : `미니 퀴즈 ${set.ids.length * 3}문제 풀기`}</button>
      <button class="btn ghost" data-act="back">단어 다시 보기</button>
    </div>`;
}

function viewQuiz() {
  const z = S.quiz, q = z.qs[z.i], n = z.qs.length;
  const answered = q.picked != null;
  const right = answered && q.picked === q.answer;
  const correctSoFar = z.qs.filter(x => x.picked != null && x.picked === x.answer).length;
  const w = W[q.id];
  return `<div class="qhead"><span>문제 ${z.i + 1} / ${n}</span><span>정답 ${correctSoFar}</span></div>
    <div class="bar"><i style="width:${((z.i + (answered ? 1 : 0)) / n) * 100}%"></i></div>
    <div class="qcard">
      <div class="qtype">${q.label}</div>
      ${q.sentence
        ? `<div class="qprompt sent" lang="ja">${esc(q.sentence).replace(esc(q.prompt), `<mark>${esc(q.prompt)}</mark>`)}</div>`
        : `<div class="qprompt jp" lang="ja">${esc(q.prompt)}</div>`}
      <p class="qnote">${esc(q.note)}</p>
    </div>
    <div class="opts">${q.opts.map((o, i) => {
      const cls = answered ? (o === q.answer ? ' right' : o === q.picked ? ' wrong' : '') : '';
      return `<button class="opt${cls}" data-act="answer" data-i="${i}" ${answered ? 'disabled' : ''}><span class="k">${i + 1}</span><span>${esc(o)}</span></button>`;
    }).join('')}</div>
    ${answered ? `<div class="feedback ${right ? 'good' : 'bad'}">${right ? '정답이에요!' : '아쉬워요.'}
      <span class="jp" lang="ja">${esc(w.w)}</span> (<span lang="ja">${esc(w.r)}</span>) = ${esc(w.m)}</div>
      <div class="actions"><button class="btn" data-act="nextQ" id="nextQ">${z.i + 1 < n ? '다음 문제' : '채점 결과 보기'}</button></div>` : ''}`;
}

function viewResult() {
  const r = S.last;
  const pct = r.score / r.total;
  const comment = pct >= .9 ? '훌륭해요! 이 세트는 거의 다 잡았어요.' : pct >= .7 ? '좋아요. 틀린 단어만 오답 노트에서 한 번 더 보면 돼요.' : '괜찮아요, 회독은 원래 반복이에요. 틀린 단어는 다음 회독 오답 노트 세트로 먼저 나와요.';
  const isLast = S.setIdx + 1 >= S.sets.length;
  return `<div class="score"><div class="big">${r.score}<small> / ${r.total}</small></div><p>${esc(setLabel(S.setIdx).title)} 미니 퀴즈 · 정답률 ${Math.round(pct * 100)}%</p></div>` +
    coach(`<p>${comment}</p>${r.added.length ? `<p>오답 노트에 담긴 단어: <b lang="ja">${r.added.filter(id => W[id]).map(id => esc(W[id].w)).join(', ')}</b></p>` : '<p>이번 세트에서 오답 노트에 새로 담긴 단어는 없어요.</p>'}
      <p>준비되면 <code>다음</code> 또는 <code>다음 세트</code>라고 입력하세요.</p>`) + `
    <form class="cmd" data-form="next"><input id="nextInput" autocomplete="off" placeholder="다음" aria-label="코치에게 말하기"><button class="btn" type="submit">보내기</button></form>
    <div class="actions"><button class="btn" data-act="nextSet">${isLast ? `${S.round}회독 마무리하기` : '다음 세트로'}</button></div>
    ${r.wrong.length ? `<div class="list"><h3>틀린 문제 ${r.wrong.length}개</h3>${r.wrong.map(q =>
      `<div class="miss"><span class="q">${esc(q.label)} · <span lang="ja">${esc(q.prompt)}</span></span><span class="a">정답 <b>${esc(q.answer)}</b><s>${esc(q.picked)}</s></span></div>`).join('')}</div>` : ''}`;
}

function viewRoundEnd() {
  const rh = S.history.filter(h => h.round === S.round);
  const sc = rh.reduce((a, h) => a + h.score, 0), tot = rh.reduce((a, h) => a + h.total, 0);
  const nconf = Object.keys(S.confused).length;
  const last = S.round >= MAX_ROUND;
  return coach(`<p><b>${S.round}회독 완료!</b> ${last ? '드디어 5회독까지 모두 마쳤어요.' : `${WORDS.length}단어를 한 바퀴 돌았어요. 이제 ${S.round + 1}회독으로 넘어갑니다.`}</p>
    ${!last ? (nconf ? `<p>${S.round + 1}회독은 헷갈린 단어 ${nconf}개로 만든 <b>오답 노트 세트</b>부터 시작하고, 이어서 ${WORDS.length}단어 전체를 다시 봐요.</p>` : `<p>오답 노트가 비어 있어요. ${S.round + 1}회독은 전체 복습으로 바로 들어가요.</p>`) : ''}`) + `
    <div class="stats">
      <div class="stat"><b>${tot ? Math.round(sc / tot * 100) : 0}%</b><small>${S.round}회독 정답률</small></div>
      <div class="stat"><b>${rh.length}</b><small>푼 세트</small></div>
      <div class="stat"><b>${nconf}</b><small>오답 노트</small></div>
    </div>
    <div class="actions"><button class="btn" data-act="nextRound">${last ? '완주 기록 보기' : `${S.round + 1}회독 시작하기`}</button>
    ${nconf ? '<button class="btn ghost" data-act="goNotes">오답 노트 먼저 보기</button>' : ''}</div>`;
}

function viewComplete() {
  const sc = S.history.reduce((a, h) => a + h.score, 0), tot = S.history.reduce((a, h) => a + h.total, 0);
  const rounds = [1,2,3,4,5].map(r => { const h = S.history.filter(x => x.round === r); const s = h.reduce((a, x) => a + x.score, 0), t = h.reduce((a, x) => a + x.total, 0); return t ? Math.round(s / t * 100) : 0; });
  return coach(`<p><b>${esc(DECK.name)} 5회독 완주를 축하해요!</b> 正 다섯 획을 모두 채웠어요. 퀴즈로 ${tot}문제를 풀었어요.</p>
    <p>${Object.keys(S.confused).length ? '아직 오답 노트에 남은 단어가 있어요. 오답 노트 탭에서 한 번 더 확인해 보세요.' : '오답 노트까지 깨끗하게 비웠어요. 완벽합니다!'}</p>`) + `
    <div class="stats">
      <div class="stat"><b>${tot ? Math.round(sc / tot * 100) : 0}%</b><small>전체 정답률</small></div>
      <div class="stat"><b>${S.history.length}</b><small>푼 세트</small></div>
      <div class="stat"><b>${Object.keys(S.confused).length}</b><small>남은 오답</small></div>
    </div>
    <div class="list"><h3>회독별 정답률</h3>${rounds.map((p, i) => `<div class="miss"><span class="a">${i + 1}회독 <b>${p}%</b></span></div>`).join('')}</div>
    <div class="actions"><button class="btn" data-act="home">다른 차수 고르기</button><button class="btn ghost" data-act="menu">이 차수 처음부터 다시 하기</button></div>`;
}

function viewNotes() {
  const ids = Object.keys(S.confused).map(Number).filter(id => W[id]).sort((a, b) => S.confused[b] - S.confused[a] || a - b);
  const past = Object.keys(S.misses).map(Number).filter(id => W[id] && !S.confused[id]);
  return `<h2 class="settitle">오답 노트</h2><p class="sub">헷갈림으로 체크했거나 퀴즈에서 틀린 단어예요. 다음 회독의 첫 세트로 먼저 나와요.</p>` +
    (ids.length ? `<div class="cards">${ids.map((id, i) => cardHTML(id, i)).join('')}</div>`
      : `<div class="empty">아직 오답 노트가 비어 있어요.<br>세트를 마치면 헷갈린 단어가 여기에 모여요.</div>`) +
    (past.length ? `<p class="daylabel">졸업한 단어 ${past.length}개</p><p class="sub" lang="ja">${past.map(id => esc(W[id].w)).join(' · ')}</p>` : '');
}

function viewWords() {
  const secs = [...new Set(WORDS.map(w => w.sec))];
  return `<h2 class="settitle">${esc(DECK.name)} 단어장</h2><p class="sub">${WORDS.length}단어 · 주황색 배지는 오답 노트에 있는 단어예요.</p>` +
    secs.map(sec => `${sec ? `<p class="daylabel">${esc(sec)}</p>` : '<p class="daylabel">전체 단어</p>'}<div class="wtable">${WORDS.filter(w => w.sec === sec).map(w =>
      `<div class="wrow"><span class="n">${esc(w.label || w.no)}</span><span class="jp" lang="ja">${esc(w.w)}<small>${esc(w.r)}</small></span><span>${esc(w.m)}</span>
       <span>${S.confused[w.no] ? `<span class="badge">헷갈림 ${S.confused[w.no]}</span>` : ''}</span></div>`).join('')}</div>`).join('');
}

function renderTabs() {
  const nav = document.getElementById('tabnav');
  nav.hidden = !(view === 'app' && S);
  if (nav.hidden) return;
  const n = Object.keys(S.confused).length;
  const t = [['learn', '학습', ICON.learn], ['notes', '오답 노트', ICON.notes], ['words', '단어장', ICON.words], ['decks', '차수 선택', ICON.decks]];
  document.getElementById('tabs').innerHTML = t.map(([k, l, ic]) =>
    `<button class="tab" data-act="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${ic}<span>${l}</span>${k === 'notes' && n ? `<span class="dot">${n}</span>` : ''}</button>`).join('');
}

function render(scrollTop) {
  renderTop(); renderTabs();
  let html;
  if (view === 'home') html = viewHome();
  else if (view === 'upload') html = viewUpload();
  else if (!S) html = `<p class="loading"><span class="spin"></span>단어를 불러오는 중이에요</p>`;
  else if (S.tab === 'notes') html = viewNotes();
  else if (S.tab === 'words') html = viewWords();
  else html = ({study: viewStudy, check: viewCheck, quiz: viewQuiz, result: viewResult, roundEnd: viewRoundEnd, complete: viewComplete})[S.phase]();
  document.getElementById('main').innerHTML = `<div class="view">${html}</div>`;
  document.querySelector('.app').style.paddingBottom = view === 'app' && S ? '' : '32px';
  if (scrollTop) window.scrollTo({top: 0});
  save();
  const nq = document.getElementById('nextQ'); if (nq) nq.focus({preventScroll: true});
  const ri = document.getElementById('renameInput'); if (ri) { ri.focus(); ri.select(); }
}

function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600);
}

/* ---------- study flow ---------- */
function finishQuiz() {
  const set = curSet(), qs = S.quiz.qs;
  const wrongBy = {};
  qs.forEach(q => { if (q.picked !== q.answer) wrongBy[q.id] = (wrongBy[q.id] || 0) + 1; });
  const added = [];
  for (const id of set.ids) {
    if (S.marks[id] === 'hard' || wrongBy[id]) {
      if (!S.confused[id]) added.push(id);
      S.confused[id] = (S.confused[id] || 0) + 1;
      S.misses[id] = (S.misses[id] || 0) + 1;
    } else if (S.confused[id]) {
      delete S.confused[id];      // 완벽 체크 + 퀴즈 3문제 모두 정답 → 오답 노트 졸업
    }
  }
  const score = qs.filter(q => q.picked === q.answer).length;
  S.last = {score, total: qs.length, added, wrong: qs.filter(q => q.picked !== q.answer).map(q => ({label: q.label, prompt: q.prompt, answer: q.answer, picked: q.picked}))};
  S.history.push({round: S.round, set: setLabel(S.setIdx).title, score, total: qs.length});
  S.quiz = null; S.phase = 'result';
}
function nextSet() {
  S.marks = {}; S.last = null; opened.clear();
  if (S.setIdx + 1 >= S.sets.length) { S.phase = 'roundEnd'; S.setIdx = S.sets.length; }
  else { S.setIdx++; S.phase = 'study'; }
  render(true);
}
function nextRound() {
  if (S.round >= MAX_ROUND) { S.phase = 'complete'; render(true); return; }
  S.round++; S.sets = buildSets(S.round, S.confused); S.setIdx = 0; S.phase = 'study'; S.tab = 'learn';
  render(true);
}

function openSheet(html) {
  const sh = document.getElementById('sheet');
  sh.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-labelledby="shT">${html}</div>`;
  sh.hidden = false;
}
const closeSheet = () => { document.getElementById('sheet').hidden = true; };

document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  // home & upload
  if (a === 'openDeck') { openDeck(+el.dataset.id); return; }
  if (a === 'home') { U = null; goHome(); return; }
  if (a === 'retryDecks') { decks = null; render(); loadDecks(); return; }
  if (a === 'upload') { U = freshUpload(); view = 'upload'; render(true); return; }
  if (a === 'renameStart') { renaming = +el.dataset.id; render(); return; }
  if (a === 'renameCancel') { renaming = null; render(); return; }
  if (a === 'deleteDeck') {
    const d = decks.find(x => x.id === +el.dataset.id);
    openSheet(`<h3 id="shT">'${esc(d.name)}' 차수를 삭제할까요?</h3><p>DB에 저장된 단어 ${d.word_count}개와 이 기기의 학습 기록이 함께 지워져요. 되돌릴 수 없어요.</p>
      <button class="btn danger" data-act="confirmDelete" data-id="${d.id}">삭제하기</button><button class="btn ghost" data-act="closeSheet">취소</button>`);
    return;
  }
  if (a === 'confirmDelete') {
    const id = +el.dataset.id; closeSheet();
    api('DELETE', `/api/deck?id=${id}`).then(() => { store.del(deckKey(id)); toast('차수를 삭제했어요'); loadDecks(); }).catch(err => toast(err.message));
    return;
  }
  if (a === 'removeFile') { U.files.splice(+el.dataset.i, 1); render(); return; }
  if (a === 'recognize') { recognize(); return; }
  if (a === 'delRow') { U.words.splice(+el.dataset.i, 1); render(); return; }
  if (a === 'addRow') { U.words.push({word: '', reading: '', meaning: '', example: '', example_ko: '', no: ''}); render(); document.querySelector(`[data-up="word"][data-i="${U.words.length - 1}"]`)?.focus(); return; }
  if (a === 'saveDeck') { saveUpload(); return; }
  if (a === 'backToPick') { U.step = 'pick'; U.error = ''; render(true); return; }
  if (a === 'closeSheet') { closeSheet(); return; }
  // study
  if (!S) return;
  if (a === 'say') { e.stopPropagation(); const w = W[+el.dataset.id]; say(isKana(w.w) ? w.w : w.r); return; }
  if (a === 'reveal') { if (!S.hide) return; const id = +el.dataset.id; opened.has(id) ? opened.delete(id) : opened.add(id); el.classList.toggle('open'); return; }
  if (a === 'hide') { S.hide = !S.hide; opened.clear(); render(); return; }
  if (a === 'toCheck') { S.started = true; S.phase = 'check'; render(true); return; }
  if (a === 'back') { S.phase = 'study'; render(true); return; }
  if (a === 'mark') { S.marks[+el.dataset.id] = el.dataset.kind; render(); return; }
  if (a === 'restOk') { curSet().ids.forEach(id => { if (!S.marks[id]) S.marks[id] = 'ok'; }); render(); return; }
  if (a === 'toQuiz') { S.quiz = buildQuiz(curSet().ids); S.phase = 'quiz'; render(true); return; }
  if (a === 'answer') { const q = S.quiz.qs[S.quiz.i]; if (q.picked == null) { q.picked = q.opts[+el.dataset.i]; render(); } return; }
  if (a === 'nextQ') { if (S.quiz.i + 1 < S.quiz.qs.length) S.quiz.i++; else finishQuiz(); render(true); return; }
  if (a === 'nextSet') { nextSet(); return; }
  if (a === 'nextRound') { nextRound(); return; }
  if (a === 'goNotes') { S.tab = 'notes'; render(true); return; }
  if (a === 'tab') { if (el.dataset.tab === 'decks') { goHome(); return; } S.tab = el.dataset.tab; render(true); return; }
  if (a === 'menu') {
    openSheet(`<h3 id="shT">${esc(DECK.name)}을 처음부터 다시 할까요?</h3><p>이 차수의 회독 진도, 오답 노트, 퀴즈 기록이 지워지고 1회독 1세트로 돌아가요. 다른 차수의 기록과 DB의 단어는 그대로예요.</p>
      <button class="btn danger" data-act="reset">이 차수 기록 지우고 다시 시작</button><button class="btn ghost" data-act="closeSheet">취소</button>`);
    return;
  }
  if (a === 'reset') { S = fresh(); opened.clear(); closeSheet(); render(true); toast('처음부터 다시 시작해요'); return; }
});

document.addEventListener('input', e => {
  const k = e.target.dataset?.up; if (!k || !U) return;
  if (k === 'name') U.name = e.target.value;
  else if (k !== 'files') U.words[+e.target.dataset.i][k] = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.dataset?.up === 'files' && U) { addFiles(e.target.files); e.target.value = ''; }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'rename') {
    const id = +e.target.dataset.id, name = document.getElementById('renameInput').value.trim();
    if (!name) { toast('차수 이름을 입력해 주세요'); return; }
    api('PATCH', `/api/deck?id=${id}`, {name}).then(() => { renaming = null; toast('이름을 바꿨어요'); loadDecks(); }).catch(err => toast(err.message));
  } else if (f === 'marks') {
    const v = document.getElementById('markInput').value.trim();
    const res = parseMarks(v, curSet().ids);
    const n = Object.keys(res).length;
    if (!n) { toast('예: 1,3,5 완벽 / 2,4,6 헷갈림 형식으로 입력해 주세요'); return; }
    Object.assign(S.marks, res); render(); toast(`${n}개 단어 상태를 적용했어요`);
  } else if (f === 'next') {
    const v = document.getElementById('nextInput').value.trim().replace(/\s+/g, '');
    if (/^(다음|다음세트|next|ㄱ|고)$/i.test(v)) nextSet();
    else toast('"다음" 또는 "다음 세트"라고 입력하면 다음으로 넘어가요');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('sheet').hidden) { closeSheet(); return; }
  if (view !== 'app' || !S || S.tab !== 'learn' || S.phase !== 'quiz' || e.target.tagName === 'INPUT') return;
  const q = S.quiz.qs[S.quiz.i];
  if (q.picked == null && /^[1-4]$/.test(e.key)) { q.picked = q.opts[+e.key - 1]; render(); }
  else if (q.picked != null && e.key === 'Enter' && document.activeElement?.id !== 'nextQ') document.getElementById('nextQ')?.click();
});

render();
loadDecks();
</script>
</body>
</html>
